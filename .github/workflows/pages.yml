name: INFERNO Build Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inferno-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout INFERNO only
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate standalone JavaScript
        run: |
          node --check inferno-core.js
          node --check inferno-capabilities.js
      - name: Verify standalone entry point and script references
        run: |
          test -s index.html
          test -s inferno-core.js
          test -s inferno-capabilities.js
          grep -q 'inferno-core.js' index.html
          grep -q 'inferno-capabilities.js' index.html
          ! grep -qi 'JARVIS-WEB' index.html
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: inferno-static-site
          path: |
            index.html
            inferno-core.js
            inferno-capabilities.js
            README.md
            LICENSE
