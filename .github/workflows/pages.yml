name: INFERNO Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inferno-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout INFERNO only
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate standalone JavaScript
        run: |
          node --check inferno-core.js
          node --check inferno-capabilities.js
      - name: Verify standalone entry point and script references
        run: |
          test -s index.html
          test -s inferno-core.js
          test -s inferno-capabilities.js
          grep -q 'inferno-core.js' index.html
          grep -q 'inferno-capabilities.js' index.html
          ! grep -qi 'JARVIS-WEB' index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy INFERNO
        id: deployment
        uses: actions/deploy-pages@v4
