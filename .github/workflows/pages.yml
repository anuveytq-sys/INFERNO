name: Deploy INFERNO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout INFERNO
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate standalone JavaScript
        run: |
          node --check inferno-core.js
          node --check inferno-capabilities.js
          node --check inferno-enhancements.js
      - name: Prepare static site
        run: |
          test -s index.html
          test -s inferno-core.js
          test -s inferno-capabilities.js
          test -s inferno-enhancements.js
          grep -q 'inferno-core.js' index.html
          grep -q 'inferno-capabilities.js' index.html
          mkdir -p _site
          cp index.html inferno-core.js inferno-capabilities.js inferno-enhancements.js README.md LICENSE _site/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./inferno-enhancements.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'inferno-enhancements.js' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
